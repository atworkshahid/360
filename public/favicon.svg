<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="mentisera-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="mentisera-grad-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="mentisera-grad-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="mentisera-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded Squircle Badge Base -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#mentisera-grad-primary)" filter="url(#mentisera-glow)" />

  <!-- Inner Soft Inset Overlay -->
  <rect x="10" y="10" width="108" height="108" rx="26" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" />

  <!-- 360 Orbital Ring (Dynamic Arc) -->
  <path d="M 64 22 A 42 42 0 1 1 24 74" fill="none" stroke="rgba(255, 255, 255, 0.35)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="7 5" />
  <path d="M 32 38 A 42 42 0 0 1 96 38" fill="none" stroke="url(#mentisera-grad-gold)" stroke-width="5" stroke-linecap="round" />

  <!-- Orbiting Satellite Dot / Outcome Marker -->
  <circle cx="96" cy="38" r="5" fill="#fde047" stroke="#ffffff" stroke-width="2" />

  <!-- Open Knowledge Book Structure -->
  <g transform="translate(64, 76)">
    <!-- Left Page of Open Book -->
    <path d="M 0 4 C -12 -6 -24 -2 -34 4 C -36 5 -36 21 -34 20 C -24 14 -12 10 0 20 Z" fill="#ffffff" fill-opacity="0.95" />
    <path d="M -4 7 C -14 -1 -24 2 -31 7" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" />
    <path d="M -4 13 C -14 5 -22 8 -29 13" fill="none" stroke="#6366f1" stroke-width="1.8" stroke-linecap="round" />

    <!-- Right Page of Open Book -->
    <path d="M 0 4 C 12 -6 24 -2 34 4 C 36 5 36 21 34 20 C 24 14 12 10 0 20 Z" fill="#ffffff" fill-opacity="0.95" />
    <path d="M 4 7 C 14 -1 24 2 31 7" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" />
    <path d="M 4 13 C 14 5 22 8 29 13" fill="none" stroke="#6366f1" stroke-width="1.8" stroke-linecap="round" />

    <!-- Book Spine Divider -->
    <line x1="0" y1="2" x2="0" y2="22" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Central Academic Beacon / Cap Mortarboard Spark -->
  <g transform="translate(64, 46)">
    <!-- Mortarboard Diamond Top -->
    <polygon points="0,-16 22,-7 0,2 -22,-7" fill="#ffffff" />
    <!-- Cap Underneath Base -->
    <path d="M -12 -3 L -12 7 C -12 12 12 12 12 7 L 12 -3 Z" fill="#e0e7ff" />
    <!-- Tassel String and Ring -->
    <path d="M 16 -5 C 20 0 22 8 22 14" fill="none" stroke="#fde047" stroke-width="2" stroke-linecap="round" />
    <circle cx="22" cy="15" r="2.2" fill="#fbbf24" />
    <!-- Central Radiant Sparkle -->
    <circle cx="0" cy="-7" r="2.5" fill="#4f46e5" />
  </g>

  <!-- Small "360" Sub-emblem Badge -->
  <g transform="translate(64, 114)">
    <rect x="-20" y="-10" width="40" height="15" rx="7.5" fill="#0f172a" />
    <text x="0" y="1" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="8.5" fill="#38bdf8" text-anchor="middle" letter-spacing="1">OBE360</text>
  </g>
</svg>
